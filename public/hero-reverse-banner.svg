<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- 배경 그라디언트: 밝고 따뜻한 샴페인 골드 & 소프트 블루 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eff6ff" />
    </linearGradient>

    <!-- 황금 골드 그라디언트 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- 샤이니 하이라이트 -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0.2" />
    </linearGradient>

    <!-- 스마트폰 디바이스 글래스 -->
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- 블루 테크 악센트 -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- 부드러운 그림자 필터 -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 1. 배경 베이스 -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- 2. 은은한 원형 앰비언트 글로우 -->
  <circle cx="600" cy="337" r="380" fill="#fef3c7" opacity="0.45" filter="blur(60px)" />
  <circle cx="850" cy="240" r="220" fill="#dbeafe" opacity="0.5" filter="blur(50px)" />
  <circle cx="350" cy="450" r="200" fill="#fef08a" opacity="0.3" filter="blur(40px)" />

  <!-- 3. 빛나는 승리의 광선 (Leverage Rays) -->
  <g opacity="0.25">
    <line x1="600" y1="337" x2="100" y2="50" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="600" y1="337" x2="1100" y2="80" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="600" y1="337" x2="1150" y2="580" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="600" y1="337" x2="50" y2="600" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 8" />
  </g>

  <!-- 4. 좌측: 실시간 모바일 심판 & 0초 리더보드 디바이스 (LEVERAGE) -->
  <g transform="translate(180, 150)" filter="url(#softShadow)">
    <!-- 스마트폰 본체 외곽 -->
    <rect x="0" y="0" width="280" height="420" rx="36" fill="#0f172a" />
    <rect x="8" y="8" width="264" height="404" rx="28" fill="url(#phoneGrad)" />
    
    <!-- 스피커 노치 -->
    <rect x="90" y="18" width="100" height="12" rx="6" fill="#0f172a" opacity="0.9" />

    <!-- 앱 화면 헤더 -->
    <rect x="20" y="44" width="240" height="40" rx="10" fill="#f8fafc" />
    <circle cx="36" cy="64" r="5" fill="#10b981" />
    <text x="48" y="68" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">심판 모바일 채점 (0초 연동)</text>

    <!-- 심판 입력 카드 -->
    <rect x="20" y="94" width="240" height="110" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="34" y="118" font-family="sans-serif" font-size="11" font-weight="bold" fill="#64748b">출전: 배번 07 김도윤</text>
    <rect x="34" y="132" width="70" height="32" rx="8" fill="#fef3c7" />
    <text x="46" y="153" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b45309">9.9 pt</text>
    
    <rect x="114" y="132" width="70" height="32" rx="8" fill="#f1f5f9" />
    <text x="126" y="153" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155">9.8 pt</text>

    <rect x="34" y="172" width="212" height="24" rx="6" fill="#f59e0b" />
    <text x="100" y="188" font-family="sans-serif" font-size="10" font-weight="900" fill="#0f172a">✓ 점수 확정 (실시간)</text>

    <!-- 실시간 랭킹 미니 뷰 -->
    <rect x="20" y="214" width="240" height="180" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="34" y="238" font-family="sans-serif" font-size="12" font-weight="900" fill="#0f172a">🏆 LIVE RANKING</text>
    
    <!-- 1등 -->
    <rect x="30" y="250" width="220" height="38" rx="8" fill="#fef3c7" />
    <circle cx="48" cy="269" r="10" fill="#f59e0b" />
    <text x="45" y="273" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">1</text>
    <text x="68" y="273" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">팀 피닉스 (99.7 pt)</text>

    <!-- 2등 -->
    <rect x="30" y="296" width="220" height="38" rx="8" fill="#f8fafc" />
    <circle cx="48" cy="315" r="10" fill="#cbd5e1" />
    <text x="45" y="319" font-family="sans-serif" font-size="10" font-weight="bold" fill="#475569">2</text>
    <text x="68" y="319" font-family="sans-serif" font-size="11" font-weight="bold" fill="#475569">블루 타이거 (Tie-Break)</text>

    <rect x="30" y="342" width="220" height="38" rx="8" fill="#f8fafc" />
    <circle cx="48" cy="361" r="10" fill="#fed7aa" />
    <text x="45" y="365" font-family="sans-serif" font-size="10" font-weight="bold" fill="#9a3412">3</text>
    <text x="68" y="365" font-family="sans-serif" font-size="11" font-weight="bold" fill="#475569">화이트 이글 (96.5 pt)</text>
  </g>

  <!-- 5. 중앙-우측: 승리와 역행자의 황금 트로피 (GLORY TROPHY) -->
  <g transform="translate(560, 90)" filter="url(#goldGlow)">
    <!-- 트로피 받침대 대리석 베이스 -->
    <rect x="90" y="440" width="240" height="30" rx="6" fill="#0f172a" />
    <rect x="110" y="415" width="200" height="25" rx="4" fill="#334155" />
    
    <!-- 받침대 골드 플레이트 -->
    <rect x="130" y="420" width="160" height="15" rx="3" fill="url(#goldGrad)" />
    <text x="145" y="432" font-family="sans-serif" font-size="9" font-weight="900" fill="#0f172a" letter-spacing="1">GENTROPHYOS CHAMPION</text>

    <!-- 트로피 기둥 받침 -->
    <path d="M 170 415 L 210 320 L 250 415 Z" fill="url(#goldGrad)" />
    <circle cx="210" cy="315" r="18" fill="url(#goldGrad)" />

    <!-- 트로피 몸통 (주 컵) -->
    <path d="M 120 140 C 120 280, 160 300, 210 300 C 260 300, 300 280, 300 140 Z" fill="url(#goldGrad)" />
    <ellipse cx="210" cy="140" rx="90" ry="24" fill="#fef08a" />
    <ellipse cx="210" cy="140" rx="78" ry="18" fill="#d97706" />
    <ellipse cx="210" cy="140" rx="72" ry="14" fill="#b45309" />

    <!-- 트로피 손잡이 (좌/우) -->
    <path d="M 120 160 C 50 170, 50 250, 140 260 C 130 250, 80 235, 120 180 Z" fill="url(#goldGrad)" />
    <path d="M 300 160 C 370 170, 370 250, 280 260 C 290 250, 340 235, 300 180 Z" fill="url(#goldGrad)" />

    <!-- 트로피 반사광 하이라이트 -->
    <path d="M 150 170 C 150 240, 175 270, 205 275 C 190 260, 170 230, 170 170 Z" fill="url(#shineGrad)" />

    <!-- 트로피 중앙 승리의 별 뱃지 -->
    <circle cx="210" cy="210" r="26" fill="#0f172a" stroke="#fef08a" stroke-width="2" />
    <polygon points="210,192 215,204 228,205 218,214 221,227 210,220 199,227 202,214 192,205 205,204" fill="url(#goldGrad)" />
  </g>

  <!-- 6. 우측 상단 플로팅 치트키 뱃지 (역행자 철학) -->
  <g transform="translate(860, 130)" filter="url(#softShadow)">
    <rect x="0" y="0" width="250" height="96" rx="20" fill="#ffffff" stroke="#f59e0b" stroke-width="2" />
    <circle cx="36" cy="36" r="16" fill="#fef3c7" />
    <text x="29" y="42" font-family="sans-serif" font-size="16">🔥</text>
    <text x="64" y="32" font-family="sans-serif" font-size="12" font-weight="900" fill="#0f172a">역행자의 자동화 레버리지</text>
    <text x="64" y="48" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f59e0b">운영 노동 시간: 14시간 ➔ 10분</text>
    
    <line x1="20" y1="64" x2="230" y2="64" stroke="#f1f5f9" stroke-width="1.5" />
    <text x="24" y="80" font-family="sans-serif" font-size="10" font-weight="bold" fill="#10b981">✓ 엑셀 타이핑 0건 · 분쟁 0건</text>
  </g>

  <!-- 7. 우측 하단 플로팅 디지털 자산화 뱃지 -->
  <g transform="translate(880, 380)" filter="url(#softShadow)">
    <rect x="0" y="0" width="240" height="88" rx="20" fill="#0f172a" />
    <circle cx="36" cy="36" r="16" fill="#1e293b" />
    <text x="29" y="42" font-family="sans-serif" font-size="16">🏛️</text>
    <text x="64" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">영구 아카이브 자산화</text>
    <text x="64" y="48" font-family="sans-serif" font-size="10" font-weight="medium" fill="#94a3b8">대회 기록이 기업가치가 된다</text>
    
    <rect x="20" y="60" width="200" height="16" rx="4" fill="#334155" />
    <text x="32" y="72" font-family="sans-serif" font-size="9" font-weight="bold" fill="#38bdf8">차기 지자체 지원금 승인 패키지</text>
  </g>

  <!-- 8. 축하 스파클 골드 파티클들 -->
  <g fill="#f59e0b">
    <circle cx="530" cy="180" r="4" opacity="0.8" />
    <circle cx="830" cy="280" r="3" opacity="0.7" />
    <circle cx="500" cy="340" r="5" opacity="0.6" />
    <circle cx="800" cy="110" r="3" opacity="0.9" />
    <circle cx="160" cy="110" r="4" opacity="0.7" />
    <circle cx="480" cy="460" r="3" opacity="0.5" />
  </g>
</svg>
